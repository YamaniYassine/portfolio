  <body>
    <script>
      /* Apply the theme before React mounts to avoid a light/dark flash */
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('theme-pref'); } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.className = dark ? 'dark-mode' : 'light-mode';
      })();
    </script>
    <noscript>You need to enable JavaScript to view this portfolio.</noscript>
    <div id="root"></div>
  </body>
